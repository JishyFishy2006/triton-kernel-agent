# Non-secret settings. Secrets (API keys) go in .env, never here.

[models]
base_url = "https://api.meta.ai/v1"
# One of: "spark_only", "wonder_only", "wonder_spark" (see B16).
setup = "wonder_spark"
# The SDK retries 429s, 5xx and connection errors with exponential backoff and
# honors Retry-After, as Meta's rate-limit docs ask.
max_retries = 5
timeout_s = 600

[models.planner]
name = "muse-wonder-1.0"
reasoning_effort = "high"

[models.fixer]
name = "muse-spark-1.3"
reasoning_effort = "low"

[budget]
max_attempts = 10
max_usd_per_task = 3.0

[modal]
# "H100!" stops Modal from silently upgrading to an H200, which would skew benchmarks.
# Modal H100s are all SXM.
gpu = "H100!"
# Wall-clock limit per candidate eval in the sandbox. A task's first eval also compiles and
# times the eager/torch.compile baselines on the visible (largest) shapes.
eval_timeout_s = 300

[paths]
# Relative paths resolve against this file's directory.
db = "data/results.duckdb"
traces = "traces"
