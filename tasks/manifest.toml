# The task list decided in Y2: see decisions/tasks_chosen.md for the reasoning.
#
# id:        L<level>-<problem number> (KernelBench at kernelbench_commit) or C-<n> (tasks/custom).
# group:     what kind of op it is, for reporting.
# split:     "dev" (tune prompts on these) or "held_out" (report results on these).
# role:      "scored" (default) or "canary" (unscored; run on every harness version, no split).
# in_fast_p: false keeps a scored task out of fast_p (default true).
# dtype:     defaults to [defaults].dtype; tolerances come from the dtype.
# input_domain: "any" (default) lets hidden cases redraw float inputs (randn, shifted);
#            "fixed" keeps get_inputs()'s distribution for inputs with a constrained domain.

kernelbench_commit = "423217d9fda91e0c2d67e4a43bf62f96f6d104f1"

[defaults]
dtype = "float32"

