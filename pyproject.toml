[project]
name = "triton-kernel-agent"
version = "0.1.0"
description = "LLM agent that writes Triton kernels, with an anti-cheat harness on Modal H100s"
authors = [
    { name = "JishyFishy2006", email = "jishnusanyal2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.38.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
